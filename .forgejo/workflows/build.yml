name: Build systems

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LANTIAN_SUBSTITUTER: https://attic.xuyh0120.win/lantian
  LANTIAN_KEY: lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
  ATTIC_ENDPOINT: https://attic.services.itssho.my

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170

    strategy:
      fail-fast: false
      matrix:
        host:
          - selene
          - temporalcatalyst

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7
        with:
          submodules: false

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GH_PAT }}
            max-jobs = 2
            cores = 2

      - name: Configure binary caches
        env:
          SUNSET_TOKEN: ${{ secrets.SUNSET_TOKEN }}
        run: |
          nix shell nixpkgs#attic-client --command bash -euo pipefail -c '
            attic login solstice "$ATTIC_ENDPOINT" "$SUNSET_TOKEN"
            attic use solstice:sunrise
            attic use solstice:sunset
          '
          mkdir -p ~/.config/nix
          printf '\nextra-substituters = %s\nextra-trusted-public-keys = %s\n' \
            "$LANTIAN_SUBSTITUTER" "$LANTIAN_KEY" >> ~/.config/nix/nix.conf

          nix config show | grep -E '^(substituters|trusted-public-keys|netrc-file) '
          test -r "$(nix config show netrc-file)" || { echo "netrc-file unreadable"; exit 1; }

      - name: Build ${{ matrix.host }}
        env:
          SUNSET_TOKEN: ${{ secrets.SUNSET_TOKEN }}
        run: |
          nix build --print-build-logs --no-write-lock-file \
            --option sandbox true \
            --option sandbox-fallback false \
            --option substitute true \
            --option fallback true \
            --override-input secrets-flake ./ci/secrets \
            ".#nixosConfigurations.${{ matrix.host }}-ci.config.system.build.toplevel" \
            --out-link result

      - name: Push to sunset
        if: success()
        env:
          SUNSET_TOKEN: ${{ secrets.SUNSET_TOKEN }}
        run: |
          nix shell nixpkgs#attic-client --command \
            attic push solstice:sunset ./result
